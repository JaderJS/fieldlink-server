services:
  server:
    hostname: fieldlink-server
    build: .
    environment:
      - PORT=${PORT}
      - REGION_MINIO=${REGION_MINIO}
      - URL_MINIO=${URL_MINIO}
      - URL_PUBLIC_MINIO=${URL_PUBLIC_MINIO}
      - ACCESS_KEY_MINIO=${ACCESS_KEY_MINIO}
      - SECRET_KEY_MINIO=${SECRET_KEY_MINIO}
      - URL_MONGO=${URL_MONGO}
      - GOOGLE_KEY=${GOOGLE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - URL_FRONT=${URL_FRONT}
      - KEY_TOKEN=${KEY_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "${PORT}:3333"
    command: npm run start
