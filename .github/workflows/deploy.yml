name: Deploy Fieldlink server

on:
  push:
    branches: 
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Nodejs
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: List build files
        run: ls -a

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{secrets.KEY_TAILSCALE}} --hostname=github-actions

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 100.103.114.48
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          source: "./*"
          target: "./fieldlinkserver"
          script: |
            cd ~/fieldlinkserver
            pm2 restart fieldlink-server || pm2 start npm --name "fieldlink-server" -- start
            
      - name: Execute remote commands on VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 100.103.114.48
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd ~/fieldlinkserver
            pm2 restart fieldlink-server || pm2 start npm --name "fieldlink-server" -- start